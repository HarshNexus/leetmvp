<!doctype html><html><head><meta charset="utf-8"><title>DSA Tracker</title><style>
:root{color-scheme:dark}
body{font:14px 'Hanken Grotesk',system-ui,-apple-system,sans-serif;width:290px;padding:18px;color:#f5eedf;background:#17130f;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(245,238,223,.09)}
header img{width:32px;height:32px;border-radius:9px;object-fit:cover}
h2{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:17px;color:#f5eedf}
h3{margin:0 0 6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:15px;color:#f5eedf}
p{margin:0 0 10px}
input{width:100%;box-sizing:border-box;padding:9px;margin:8px 0;border:1px solid rgba(245,238,223,.17);border-radius:8px;background:#211b15;color:#f5eedf}
button{width:100%;padding:10px;margin-top:8px;border:0;border-radius:9px;background:#ff7a45;color:#1c0f08;font-weight:700;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:#ff9068}
button:active{transform:scale(.98)}
button[disabled]{opacity:.55;cursor:wait}
.secondary{background:transparent;color:#f5eedf;border:1px solid rgba(245,238,223,.17)}
.secondary:hover{background:#2a2219}
.status{display:flex;align-items:center;gap:7px;padding:9px 10px;background:#2a2219;border-radius:8px;margin:0 0 10px;font-weight:600;color:#5fd9c4}
.muted{color:#b9ad97;font-size:12px}
.error{color:#ef6a5a;font-size:12px;margin-top:8px}
#app{color:#847b69;font-size:13px}
</style></head><body><header><img src="assets/dsa-tracker-logo.png" alt=""><h2>DSA Tracker</h2></header><div id="app">Loading…</div><script src="popup.js"></script></body></html>
